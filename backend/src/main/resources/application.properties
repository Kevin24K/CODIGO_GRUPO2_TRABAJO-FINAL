spring.application.name=demosi
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/lost_found_db
spring.datasource.username=postgres
spring.datasource.password=1234

# Clave para firmar los JWT (HS512 requiere 64+ caracteres)
jwt.secret=mi-clave-super-secreta-absolutamente-segura-para-jwt-512-bits-lost-and-found-seguridad-grupo2-upc-2026-sistema-web

# ===== IA - Gemini (HUF17 / HUF19) =====
gemini.api-key=${GEMINI_API_KEY:}
gemini.url=https://generativelanguage.googleapis.com/v1beta
gemini.modelo-vision=gemini-3.5-flash-lite
gemini.modelo-embeddings=gemini-embedding-001

# Notificaciones: coincidencias automaticas
# % minimo de similitud para avisar al dueno del objeto perdido
coincidencias.umbral=80

#Notificaciones push - Firebase Cloud Messaging
firebase.credenciales=${FIREBASE_CREDENTIALS:}
