spring.application.name=demosi
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/lost_found_db
spring.datasource.username=postgres
spring.datasource.password=1234

# Clave para firmar los JWT (HS512 requiere 64+ caracteres)
jwt.secret=mi-clave-super-secreta-absolutamente-segura-para-jwt-512-bits-lost-and-found-seguridad-grupo2-upc-2026-sistema-web

# ===== IA - Hugging Face (HUF17 / HUF19) =====
huggingface.token=${HF_TOKEN:}
huggingface.url=https://router.huggingface.co
huggingface.modelo-vision=Qwen/Qwen2.5-VL-7B-Instruct
huggingface.modelo-embeddings=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
https://huggingface.co/settings/tokens