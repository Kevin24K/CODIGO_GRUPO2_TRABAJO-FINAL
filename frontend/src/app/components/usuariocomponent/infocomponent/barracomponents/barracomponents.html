<div class="informe-grid">
  <div class="chart-card">
    @if (cargando) {
      <p class="mensaje-estado">Cargando reportes...</p>
    } @else if (sinReportes) {
      <p class="mensaje-estado" role="status">
        No existen reportes registrados por categoría en este momento.
      </p>
    } @else {
      <div class="chart-box">
        <canvas
          baseChart
          [data]="chartData"
          [options]="chartOptions"
          [type]="chartType">
        </canvas>
      </div>
    }
  </div>
