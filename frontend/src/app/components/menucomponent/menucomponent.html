<mat-toolbar>
    <button matIconButton routerLink="/" aria-label="Inicio">
        <mat-icon>home</mat-icon>
    </button>
    <span class="marca">Lost &amp; Found IA</span>

    <button matButton [matMenuTriggerFor]="menuCategoria">Categorías</button>
    <mat-menu #menuCategoria="matMenu">
        <button mat-menu-item routerLink="/categorias/listar"><mat-icon>list</mat-icon>Listar</button>
        <button mat-menu-item routerLink="/categorias/insertar"><mat-icon>add</mat-icon>Registrar</button>
    </mat-menu>

    <button matButton [matMenuTriggerFor]="menuObjeto">Objetos</button>
    <mat-menu #menuObjeto="matMenu">
        <button mat-menu-item routerLink="/objetos/listar"><mat-icon>list</mat-icon>Listar</button>
        <button mat-menu-item routerLink="/objetos/insertar"><mat-icon>add</mat-icon>Registrar</button>
    </mat-menu>

    <button matButton [matMenuTriggerFor]="menuReporte">Reportes</button>
    <mat-menu #menuReporte="matMenu">
        <button mat-menu-item routerLink="/reportes/listar"><mat-icon>list</mat-icon>Listar</button>
        <button mat-menu-item routerLink="/reportes/insertar"><mat-icon>add</mat-icon>Registrar</button>
    </mat-menu>

    <button matButton routerLink="/buscar"><mat-icon>travel_explore</mat-icon> Buscar objeto</button>

    @if (lS.esAdmin()) {
        <button matButton [matMenuTriggerFor]="menuUsuario">Usuarios</button>
        <mat-menu #menuUsuario="matMenu">
            <button mat-menu-item routerLink="/usuarios/listar"><mat-icon>list</mat-icon>Listar</button>
            <button mat-menu-item routerLink="/usuarios/insertar"><mat-icon>add</mat-icon>Registrar</button>
            <button mat-menu-item routerLink="/usuarios/informacion"><mat-icon>bar_chart</mat-icon>Información</button>
        </mat-menu>

        <button matButton [matMenuTriggerFor]="menuCoincidencia">Coincidencias</button>
        <mat-menu #menuCoincidencia="matMenu">
            <button mat-menu-item routerLink="/coincidencias/listar"><mat-icon>list</mat-icon>Listar</button>
            <button mat-menu-item routerLink="/coincidencias/insertar"><mat-icon>add</mat-icon>Registrar</button>
        </mat-menu>
    }

    <button matButton [matMenuTriggerFor]="menuNotificacion">Notificaciones</button>
    <mat-menu #menuNotificacion="matMenu">
        <button mat-menu-item routerLink="/notificaciones/listar"><mat-icon>list</mat-icon>Listar</button>
        @if (lS.esAdminOStaff()) {
            <button mat-menu-item routerLink="/notificaciones/insertar"><mat-icon>add</mat-icon>Registrar</button>
        }
    </mat-menu>

    <span class="espacio"></span>

    <!-- Notificaciones: coincidencias >= 80 % con mis reportes -->
    <button matIconButton [matMenuTriggerFor]="menuNoti" (menuOpened)="cargarUltimas()"
        matTooltip="Notificaciones" aria-label="Notificaciones">
        <mat-icon [matBadge]="nS.noLeidas()" [matBadgeHidden]="nS.noLeidas() === 0" matBadgeColor="warn"
            matBadgeSize="small" aria-hidden="false">notifications</mat-icon>
    </button>
    <mat-menu #menuNoti="matMenu" class="menu-noti" xPosition="before">
        <div class="noti-cabecera">Notificaciones</div>
        @for (n of ultimas(); track n.idNotificacion) {
            <button mat-menu-item class="noti-item" [class.no-leida]="!n.leidaNotificacion" (click)="abrir(n)">
                <span class="noti-pct">{{ n.porcentaje }} %</span>
                <span class="noti-texto">{{ n.tituloNotificacion }}</span>
            </button>
        } @empty {
            <div class="noti-vacio">Aún no tienes notificaciones</div>
        }
        <button mat-menu-item routerLink="/notificaciones"><mat-icon>list</mat-icon>Ver todas</button>
    </mat-menu>

    <button matButton [matMenuTriggerFor]="menuCuenta" class="cuenta">
        <mat-icon>account_circle</mat-icon>
        <span class="correo">{{ lS.getCorreo() }}</span>
    </button>
    <mat-menu #menuCuenta="matMenu">
        @if (lS.esAdmin()) {
            <button mat-menu-item routerLink="/usuarios/informacion"><mat-icon>bar_chart</mat-icon>Información</button>
            <button mat-menu-item routerLink="/notificaciones/insertar"><mat-icon>notification_add</mat-icon>Registrar notificación</button>
        }
        <button mat-menu-item routerLink="/notificaciones/listar"><mat-icon>notifications</mat-icon>Notificaciones</button>
        <button mat-menu-item (click)="cerrarSesion()"><mat-icon>logout</mat-icon>Cerrar sesión</button>
    </mat-menu>
</mat-toolbar>
