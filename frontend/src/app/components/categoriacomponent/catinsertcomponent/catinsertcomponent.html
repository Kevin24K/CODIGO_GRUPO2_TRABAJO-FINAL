<div class="page">
    <div class="page-header">
        <h2><mat-icon>category</mat-icon> Registrar Categoría</h2>
    </div>

    <mat-card class="form-card">
        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="registrar()">
                <div class="form-grid">
                    <mat-form-field appearance="outline" class="full">
                        <mat-label>Nombre</mat-label>
                        <input matInput formControlName="nombreCategoria" placeholder="Ej: Electrónicos">
                        @if (form.get('nombreCategoria')?.hasError('required')) {
                            <mat-error>El nombre es obligatorio</mat-error>
                        }
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="full">
                        <mat-label>Descripción</mat-label>
                        <textarea matInput formControlName="descripcionCategoria" rows="3"
                            placeholder="Ej: Celulares, laptops, audífonos, cargadores..."></textarea>
                        @if (form.get('descripcionCategoria')?.hasError('required')) {
                            <mat-error>La descripción es obligatoria</mat-error>
                        }
                    </mat-form-field>

                    <mat-slide-toggle formControlName="activoCategoria" class="full">Categoría activa</mat-slide-toggle>
                </div>

                <div class="form-acciones">
                    <a matButton routerLink="/categorias/listar">Cancelar</a>
                    <button matButton="filled" type="submit" [disabled]="guardando()">
                        <mat-icon>save</mat-icon> Registrar
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
