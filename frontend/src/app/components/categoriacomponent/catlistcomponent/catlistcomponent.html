<div class="page">
    <div class="page-header">
        <h2><mat-icon>category</mat-icon> Lista de Categorías</h2>
        <a matButton="filled" routerLink="/categorias/insertar"><mat-icon>add</mat-icon> Registrar categoría</a>
    </div>

    <div class="tabla-wrap">
        <table mat-table [dataSource]="dataSource" class="tabla">

            <ng-container matColumnDef="c1">
                <th mat-header-cell *matHeaderCellDef> ID </th>
                <td mat-cell *matCellDef="let element"> {{element.idCategoria}} </td>
            </ng-container>

            <ng-container matColumnDef="c2">
                <th mat-header-cell *matHeaderCellDef> Nombre </th>
                <td mat-cell *matCellDef="let element"> <strong>{{element.nombreCategoria}}</strong> </td>
            </ng-container>

            <ng-container matColumnDef="c3">
                <th mat-header-cell *matHeaderCellDef> Descripción </th>
                <td mat-cell *matCellDef="let element"> {{element.descripcionCategoria}} </td>
            </ng-container>

            <ng-container matColumnDef="c4">
                <th mat-header-cell *matHeaderCellDef> Estado </th>
                <td mat-cell *matCellDef="let element">
                    <span class="chip" [class.chip-ok]="element.activoCategoria" [class.chip-no]="!element.activoCategoria">
                        {{element.activoCategoria ? 'Activa' : 'Inactiva'}}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="c5">
                <th mat-header-cell *matHeaderCellDef> Acciones </th>
                <td mat-cell *matCellDef="let element">
                    <button matIconButton class="btn-eliminar" (click)="eliminarCategoria(element)" aria-label="Eliminar categoría">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="sin-datos" [attr.colspan]="displayedColumns.length">No hay categorías registradas</td>
            </tr>
        </table>
    </div>
</div>
